# Publie l'image officielle sur Docker Hub (manganate06/openlmnp) à chaque release.
#
# Déclencheur = push de tag (comme release.yml), PAS l'événement `release:published` :
# les releases sont créées par release.yml avec `github.token`, et les actions faites
# avec ce token ne déclenchent jamais d'autres workflows.
name: Docker

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existant à publier (ex : v1.1.1)'
        required: true

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sur workflow_dispatch, se placer sur le tag demandé (pas sur la branche
          # par défaut) pour construire l'image du bon commit.
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Résoudre le tag
        id: t
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: QEMU (émulation arm64)
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags et labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: manganate06/openlmnp
          # `value:` explicite : sur workflow_dispatch, github.ref n'est pas le tag.
          tags: |
            type=semver,pattern={{version}},value=${{ steps.t.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.t.outputs.tag }}
            type=raw,value=latest

      - name: Build + push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
