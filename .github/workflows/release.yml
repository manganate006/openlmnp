name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existant à publier (ex : v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sur workflow_dispatch, se placer sur le tag demandé (pas sur la branche
          # par défaut) pour que `git archive HEAD` produise l'archive du bon commit.
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Résoudre le tag
        id: t
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Construire l'archive source (asset de release)
        id: asset
        run: |
          v="${{ steps.t.outputs.tag }}"; v="${v#v}"
          file="openlmnp-${v}.tar.gz"
          # Archive source (le script d'install fait ensuite composer/npm build).
          # Dossier racine openlmnp/ que le framework community-scripts strip à l'extraction.
          git archive --format=tar.gz --prefix=openlmnp/ -o "$file" HEAD
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "----- asset -----"; ls -lh "$file"

      - name: Extraire les notes du CHANGELOG
        run: |
          v="${{ steps.t.outputs.tag }}"
          v="${v#v}"
          awk -v ver="$v" '
            $0 ~ ("^## \\[" ver "\\]") { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > NOTES.md
          # Pré-version (v2.0.0-beta.1) : sa section ne porte que l'avertissement, le détail
          # des changements est celui de la version visée (2.0.0), ajouté à la suite.
          base="${v%%-*}"
          if [ "$base" != "$v" ]; then
            awk -v ver="$base" '
              $0 ~ ("^## \\[" ver "\\]") { f = 1; next }
              f && /^## \[/ { exit }
              f { print }
            ' CHANGELOG.md >> NOTES.md
          fi
          if [ ! -s NOTES.md ]; then
            echo "Voir CHANGELOG.md pour le détail des changements." > NOTES.md
          fi
          echo "----- notes -----"; cat NOTES.md

      - name: Créer (ou mettre à jour) la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.t.outputs.tag }}"
          asset="${{ steps.asset.outputs.file }}"
          # ⚠️ Un tag à tiret (v2.0.0-beta.1) est une PRÉ-VERSION. Sans `--prerelease`, elle
          # devenait la « latest » de GitHub : `UpdateService` (qui lit /releases/latest) et
          # le script d'installation l'auraient proposée à toutes les instances.
          pre=""
          case "$tag" in *-*) pre="--prerelease --latest=false" ;; esac
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "OpenLMNP $tag" --notes-file NOTES.md $pre
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "OpenLMNP $tag" --notes-file NOTES.md --verify-tag $pre
          fi
          # Asset téléchargeable : son download_count sert de proxy d'installations
          # self-hosted (voir community-scripts/install/openlmnp-install.sh).
          gh release upload "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --clobber

  # Le registre MCP officiel ne lit pas server.json sur GitHub : il faut le lui publier.
  # Sans ce job, server.json suivait bien les releases mais le registre est resté
  # bloqué à 1.6.7 jusqu'à la 2.0.1 (ticket #30160).
  mcp-registry:
    runs-on: ubuntu-latest
    needs: release
    # Une pré-version (v2.0.0-beta.1) ne part pas au registre : c'est sa dernière
    # entrée publiée que les clients MCP proposent.
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
    permissions:
      contents: read
      id-token: write   # authentification OIDC sur le namespace io.github.manganate006
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Vérifier que server.json et version.json suivent le tag
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"; v="${tag#v}"
          s=$(jq -r .version server.json); a=$(jq -r .version version.json)
          echo "tag=$v server.json=$s version.json=$a"
          if [ "$s" != "$v" ] || [ "$a" != "$v" ]; then
            echo "::error::server.json ($s) ou version.json ($a) ne correspond pas au tag ($v)"
            exit 1
          fi

      - name: Publier server.json au registre MCP
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
