; Configuration PHP de l'image OpenLMNP.
;
; Fichier volontairement posé par un COPY plutôt que généré par un heredoc dans le
; Dockerfile : les heredocs exigent BuildKit avec un frontend Dockerfile >= 1.4, et
; le LXC de production tourne encore sur Docker 20.10 (builder classique, pas de
; buildx). Un simple COPY fonctionne avec les deux builders.

memory_limit = 512M

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; L'image est immuable : le code n'est jamais modifié en place dans le conteneur
; (mise à jour = docker pull + recréation, cf. UPDATE_SELF_APPLY dans .env.docker).
; On peut donc désactiver la revalidation des dates de modification.
opcache.validate_timestamps = 0
